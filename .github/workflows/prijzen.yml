name: Prijzen bijwerken

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prijzen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s engine/tests

      - name: Prijzen ophalen
        env:
          AWIN_3DJAKE_FEED_URL: ${{ secrets.AWIN_3DJAKE_FEED_URL }}
          DAISYCON_FEPSHOP_FEED_URL: ${{ secrets.DAISYCON_FEPSHOP_FEED_URL }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python engine/prijzen.py

      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "spoelprijs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json history.csv
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt $(date +%F)"
          git push
